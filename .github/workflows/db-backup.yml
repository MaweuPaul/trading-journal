# Nightly database backup: copies the whole live MongoDB database into a dated
# database (backup_YYYY-MM-DD) on a separate backup cluster, checks the copy and
# keeps 7 daily, 8 weekly and 12 monthly copies. See backend/scripts/backup-to-database.js.
#
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   MONGODB_URI         the live database (same value as on Render)
#   BACKUP_MONGODB_URI  the backup cluster (a separate Atlas cluster/project)
# Optional repository variables: MONGODB_DB_NAME, BACKUP_KEEP (daily, default 7),
# BACKUP_KEEP_WEEKLY (default 8), BACKUP_KEEP_MONTHLY (default 12).
# GitHub emails the repository owner when a scheduled run fails.
name: Database backup

on:
  schedule:
    - cron: '17 2 * * *'   # every day at 02:17 UTC
  workflow_dispatch:
    inputs:
      force:
        description: Redo today's backup even if it already exists
        type: boolean
        default: false

concurrency:
  group: db-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --omit=dev
      - name: Back up the database
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          BACKUP_MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
          MONGODB_DB_NAME: ${{ vars.MONGODB_DB_NAME }}
          BACKUP_KEEP: ${{ vars.BACKUP_KEEP }}
          BACKUP_KEEP_WEEKLY: ${{ vars.BACKUP_KEEP_WEEKLY }}
          BACKUP_KEEP_MONTHLY: ${{ vars.BACKUP_KEEP_MONTHLY }}
        run: node scripts/backup-to-database.js ${{ inputs.force && '--force' || '' }}
      - name: List backups
        if: always()
        env:
          BACKUP_MONGODB_URI: ${{ secrets.BACKUP_MONGODB_URI }}
        run: node scripts/backup-to-database.js --list
